backend:
  name: git-gateway
  branch: main
  base_url: https://jbarbeau.netlify.app/.netlify/identity
  auth_redirect_url: https://jbarbeau.netlify.app/confirmation.html
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'

# Global media folder settings
media_folder: "/public/assets"
public_folder: "/assets"

# Enable local backend only in development
local_backend: true

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "project"
    label: "Projects"
    folder: "src/content/project"
    create: true
    summary: "{{fields.title}}"
    format: frontmatter
    extension: md
    media_folder: "/public/assets/{{fields.slug}}"
    public_folder: "/assets/{{fields.slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "Publish Date", name: "publishDate", widget: "datetime"}
      - {label: "Collection", name: "collection", widget: "hidden", default: "project"}
      - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
      - {label: "Subtitle (French)", name: "subtitleFr", widget: "string", required: false}
      - {label: "Description", name: "description", widget: "markdown", required: true}
      - {label: "Description (French)", name: "descriptionFr", widget: "markdown", required: false}
      - {label: "URL", name: "url", widget: "string"}
      - {label: "Is Redeemable", name: "isRedeemable", widget: "boolean", default: false}
      - {label: "Redeem URL", name: "redeemUrl", widget: "string", required: false}
      - label: "Project Image"
        name: "image"
        widget: "image"
        choose_url: true
        required: false
        media_folder: "/public/assets/{{fields.slug}}"
        public_folder: "/assets"
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.image}}"
        field:
          label: "Image"
          name: "image"
          widget: "image"
          choose_url: true
          media_folder: "/public/assets/{{fields.slug}}"
          public_folder: "/assets/{{fields.slug}}"
          allow_multiple: false
      - label: "Slider Configuration (Number of slides visible per screen size)"
        name: "slider"
        widget: "list"
        required: false
        field:
          label: "Number of slides"
          name: "image"
          widget: "string"
          hint: "Enter numbers in order: [Large screens >900px, Medium screens 500px-900px, Small screens <500px]"
      - {label: "Body", name: "body", widget: "markdown", required: false}

  - name: "blog_en"
    label: "Blog Posts (EN)"
    folder: "src/content/blog"
    create: true
    summary: "{{fields.title}}"
    format: frontmatter
    extension: mdx
    media_folder: "/public/assets/blog"
    public_folder: "/assets/blog"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime"}
      - {label: "Substack URL", name: "substackUrl", widget: "string"}
      - label: "Cover Image"
        name: "image"
        widget: "image"
        choose_url: true
        required: false
        media_folder: "/public/assets/blog"
        public_folder: "/assets/blog"
      - {label: "Excerpt", name: "excerpt", widget: "text", required: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Body", name: "body", widget: "markdown", required: false}

  - name: "blog_fr"
    label: "Blog Posts (FR)"
    folder: "src/content/blog/fr"
    create: true
    summary: "{{fields.title}}"
    format: frontmatter
    extension: mdx
    media_folder: "/public/assets/blog"
    public_folder: "/assets/blog"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date de publication", name: "pubDate", widget: "datetime"}
      - {label: "URL Substack", name: "substackUrl", widget: "string", hint: "Même URL que le post EN correspondant"}
      - label: "Image de couverture"
        name: "image"
        widget: "image"
        choose_url: true
        required: false
        media_folder: "/public/assets/blog"
        public_folder: "/assets/blog"
      - {label: "Extrait", name: "excerpt", widget: "text", required: false}
      - {label: "Brouillon", name: "draft", widget: "boolean", default: false}
      - {label: "Corps", name: "body", widget: "markdown", required: false, hint: "Le nom du fichier doit correspondre au post EN à traduire (ex: my-post.md)"}

  - name: "shop"
    label: "Shop"
    folder: "src/content/shop"
    create: true
    summary: "{{fields.title}} ({{fields.type}} — {{fields.status}})"
    format: frontmatter
    extension: md
    media_folder: "/public/assets/shop"
    public_folder: "/assets/shop"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Title (French)", name: "titleFr", widget: "string", required: false}
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - {label: "Digital download", value: "digital"}
          - {label: "Print (limited edition)", value: "print"}
          - {label: "NFT collection", value: "nft"}
      - label: "Status"
        name: "status"
        widget: "select"
        default: "available"
        options:
          - {label: "Available", value: "available"}
          - {label: "Coming soon", value: "upcoming"}
          - {label: "Minting now", value: "minting"}
          - {label: "Sold out", value: "soldout"}
      - {label: "Price (display only, e.g. \"250 CAD\" or \"0.05 ETH\")", name: "price", widget: "string", required: false}
      - {label: "Price (French display, e.g. \"250 $ CAD\")", name: "priceFr", widget: "string", required: false}
      - {label: "Edition info (e.g. \"1/1/256\" or \"Edition of 30, signed\")", name: "editionInfo", widget: "string", required: false}
      - {label: "Edition info (French)", name: "editionInfoFr", widget: "string", required: false}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Description (French)", name: "descriptionFr", widget: "markdown", required: false}
      - label: "Images"
        name: "images"
        widget: "list"
        summary: "{{fields.image}}"
        field:
          label: "Image"
          name: "image"
          widget: "image"
          choose_url: true
          media_folder: "/public/assets/shop"
          public_folder: "/assets/shop"
          allow_multiple: false
      - {label: "External URL (NFT)", name: "externalUrl", widget: "string", required: false, hint: "Toujours utiliser la page raster.art de la collection (https://raster.art/artwork/<slug>-by-jonathan-barbeau) — sauf pendant un mint actif: URL de la mint page de la plateforme"}
      - {label: "Platform (e.g. fxhash, Art Blocks, Transient Labs, 256art)", name: "platform", widget: "string", required: false}
      - {label: "Stripe Price ID (future checkout — leave empty)", name: "stripePriceId", widget: "string", required: false}
      - {label: "Publish Date", name: "publishDate", widget: "datetime"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Body", name: "body", widget: "markdown", required: false}

  - label: "Collection Preview"
    name: "collection_preview"
    files:
      - label: "Collection Preview Page"
        name: "collection_preview"
        file: "src/content/collection-preview/index.md"
        format: frontmatter
        extension: md
        media_folder: "/public/assets/collection-preview"
        public_folder: "/assets/collection-preview"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - label: "Images"
            name: "images"
            widget: "list"
            required: false
            summary: "{{fields.image}}"
            field:
              label: "Image"
              name: "image"
              widget: "image"
              choose_url: true
              media_folder: "/public/assets/collection-preview"
              public_folder: "/assets/collection-preview"
              allow_multiple: false
